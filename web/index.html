<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Khel chat test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem;color:#0f172a}
button{background:#059669;color:#fff;border:0;border-radius:8px;padding:.6rem 1rem;font-size:1rem;cursor:pointer}
input{padding:.6rem;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;width:100%;box-sizing:border-box;margin:.25rem 0}
#log{border:1px solid #e2e8f0;border-radius:8px;min-height:160px;padding:.6rem;margin:.75rem 0;overflow:auto}
.me{text-align:right;color:#047857}.hidden{display:none}#status{color:#475569}
</style></head><body>
<h1>Khel chat test</h1>
<button id="login">Continue with Google</button>
<p id="status"></p>
<div id="chat" class="hidden">
  <label>Chat with (their user id)<input id="peer" placeholder="Other player's user id"/></label>
  <div id="log" aria-live="polite"></div>
  <input id="text" placeholder="Type a message"/><button id="send">Send</button>
</div>
<script type="module" src="./main.js"></script>
</body></html>
