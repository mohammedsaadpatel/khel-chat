<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khel & Hangout chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#059669;--accent-ink:#fff;--mine:#059669;--mine-ink:#fff;--theirs:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#020617;--panel:#0f172a;--line:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#10b981;--accent-ink:#022c22;--mine:#10b981;--mine-ink:#022c22;--theirs:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
h1{font:700 1.5rem 'Outfit',sans-serif;margin:0}
h2{font:600 .75rem 'Plus Jakarta Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.5rem 0 .25rem}
.wrap{max-width:960px;margin:0 auto;padding:1.25rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
button{font-family:inherit;font-weight:600;font-size:.95rem;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:.55rem .9rem;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%}
#status{color:var(--muted);margin:.25rem 0 1rem}
#status.err{color:#dc2626}
#app{display:grid;grid-template-columns:270px 1fr;gap:1rem;min-height:65vh}
@media (max-width:700px){#app{grid-template-columns:1fr}}
.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;gap:.5rem;align-items:center}
.me{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.2rem}
li button{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;border-radius:8px;padding:.4rem .5rem;font-weight:500;overflow-wrap:anywhere}
li button[aria-current=true]{border-color:var(--accent)}
.badge{float:right;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 .5rem;font-size:.8rem}
details{border-top:1px solid var(--line);padding-top:.5rem}
summary{cursor:pointer;font-weight:600}
details .row{margin-top:.4rem}
.head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.4rem;min-height:260px;max-height:55vh}
.msg{max-width:78%;padding:.45rem .75rem;border-radius:14px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{background:var(--mine);color:var(--mine-ink);align-self:flex-end}
.from{display:block;font-size:.72rem;opacity:.7}
.empty{color:var(--muted);margin:auto;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Khel &amp; Hangout chat</h1>
    <button id="login">Continue with Google</button>
  </header>
  <p id="status" role="status"></p>

  <div id="app" class="hidden">
    <aside class="side">
      <div class="me"><strong id="name"></strong><button class="ghost" id="copy">Copy my id</button></div>
      <h2>Communities</h2>
      <ul id="communities"></ul>
      <h2>My chats</h2>
      <ul id="people"></ul>
      <details>
        <summary>Start something</summary>
        <label for="peer">Direct message (their user id)</label>
        <div class="row"><input id="peer" autocomplete="off" /><button id="open">Open</button></div>
        <label for="gname">New group</label>
        <div class="row"><input id="gname" placeholder="Group name" autocomplete="off" /><button id="create">Create</button></div>
        <label for="gid">Join a group (its id)</label>
        <div class="row"><input id="gid" autocomplete="off" /><button id="join">Join</button></div>
      </details>
    </aside>
    <section class="main" aria-label="Conversation">
      <div class="head">
        <strong id="title">Pick a community or start a chat</strong>
        <div class="row hidden" id="actions">
          <button class="ghost" id="copygid">Copy group id</button>
          <button class="ghost" id="leave">Leave</button>
        </div>
      </div>
      <div id="log" aria-live="polite"><p class="empty">Join a community, create a group, or message a friend.</p></div>
      <div class="row">
        <input id="text" placeholder="Type a message and press Enter" autocomplete="off" disabled />
        <button id="send" disabled>Send</button>
      </div>
    </section>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
